<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Manrope:wght@500;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0716;font-family:Manrope,sans-serif;padding:26px;width:2160px;color:#BCA9D5}
h2{margin:0 0 4px;font:700 22px 'Cormorant Garamond',serif;color:#F4EFF8}
.sub{font:500 12px Manrope;margin:0 0 12px;color:#BCA9D5}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.col{display:flex;flex-direction:column;gap:12px}
.panel{border-radius:18px;padding:18px}
.dk{background:#160C24;color:#F4EFF8}
.lt{background:#F4ECE0;color:#1B102C}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:600 12px Manrope;padding:6px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%}
.card{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dk .card{background:#25153C}
.lt .card{background:#FCF8F1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.msg{font:500 14px/1.35 Manrope}
.btn{font:700 13px Manrope;padding:9px 14px;border-radius:10px;border:0;white-space:nowrap}
.mut{font:500 12px Manrope;opacity:.75}
.hex{font:600 11px Manrope;opacity:.8;margin-top:2px}
</style></head><body>
<div class="grid" id="g"></div>
<script>
const C=[
 {n:'C0 · Óxido',d:'#DB6D63',l:'#A6382E',note:'your pick, the reference'},
 {n:'C1 · Polvo',d:'#C9766F',l:'#96443C',note:'dustier, softer, more sober'},
 {n:'C2 · Vivo',d:'#EB6059',l:'#AD2D26',note:'redder, strongest alarm, nearest to coral'},
 {n:'C3 · Cálido',d:'#D67060',l:'#A13C2D',note:'a touch warmer, more terracotta'},
 {n:'C4 · Arcilla',d:'#D4716E',l:'#9E3F3C',note:'a touch cooler, clay-rose'}];
const g=document.getElementById('g');
for(const c of C){
 const col=document.createElement('div');col.className='col';
 const panel=(theme)=>{
  const dk=theme==='dk';const red=dk?c.d:c.l;
  const gold='#F4B64C',cel=dk?'#90CEA8':'#2E6A4C';
  const onred=dk?'#160C24':'#FCF8F1';
  const glow=dk?`box-shadow:0 0 0 1px ${red}88,0 8px 32px -8px ${red}66`:`box-shadow:0 0 0 1px ${red}66`;
  return `<div class="panel ${theme}">
   <div class="chips">
    <span class="chip" style="background:${gold};color:#160C24">Te necesitan</span>
    <span class="chip" style="border:1px solid ${cel};color:${cel}"><span class="dot" style="background:${cel}"></span>Autopiloto</span>
    <span class="chip" style="background:${red};color:${onred}">Urgente</span>
    <span class="chip" style="color:${red};border:1px solid ${red}"><span class="dot" style="background:${red}"></span>No se envió</span>
   </div>
   <div class="card" style="${glow}">
    <div class="row"><span class="msg" style="font-weight:700">Un huésped reporta una fuga de agua</span><span class="chip" style="background:${red};color:${onred}">Urgente</span></div>
    <div class="mut">Alfred no puede resolverlo solo.</div>
    <div class="row"><button class="btn" style="background:${red};color:${onred}">Llamar ahora</button><span class="msg" style="color:${red};font-weight:600">Ver conversación</span></div>
   </div>
   <div class="hex">${dk?'dark':'light'} · ${red}</div>
  </div>`};
 col.innerHTML=`<div><h2>${c.n}</h2><div class="sub">${c.note}</div></div>${panel('dk')}${panel('lt')}`;
 g.appendChild(col);
}
</script></body></html>
