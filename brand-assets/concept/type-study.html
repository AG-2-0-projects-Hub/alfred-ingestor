<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@500;600&display=swap">
<style>
:root{--aub:#160C24;--pearl:#F4EFF8;--lilac:#BCA9D5;--bone:#F4ECE0;--ink:#1B102C}
*{box-sizing:border-box}
body{margin:0;background:#0d0716;font-family:Manrope,sans-serif;color:var(--lilac);padding:28px;width:1500px}
h6{margin:0 0 10px;font:600 13px Manrope;letter-spacing:.06em;text-transform:uppercase;color:var(--lilac)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px}
.card{border-radius:20px;padding:22px 10px 26px;background:var(--aub);text-align:center}
.card.lt{background:var(--bone)}
.card svg{width:190px;height:190px;display:block;margin:0 auto;overflow:visible}
.wm{font-family:'Cormorant Garamond',serif;color:var(--pearl);line-height:1;margin-top:10px}
.lt .wm{color:var(--ink)}
.tag{font-family:'Cormorant Garamond',serif;color:var(--pearl);font-size:60px;line-height:1.1;padding:60px 0}
.cap{font:500 12px Manrope;color:var(--lilac);margin-top:12px}
.lt .cap{color:#5E4D75}
</style></head><body>
<h6>Wordmark: weight, with the reflection fading out above the letters</h6>
<div class="row" id="r1">
  <div class="card"><svg id="s1"></svg><div class="wm" style="font-weight:600;font-size:54px">mayordommo</div><div class="cap">A · 600 (v1, current)</div></div>
  <div class="card"><svg id="s2"></svg><div class="wm" style="font-weight:700;font-size:56px;letter-spacing:.01em">mayordommo</div><div class="cap">B · 700</div></div>
  <div class="card lt"><svg id="s3"></svg><div class="wm" style="font-weight:700;font-size:56px;letter-spacing:.01em">mayordommo</div><div class="cap">B · 700 on bone</div></div>
</div>
<h6>Tagline</h6>
<div class="row">
  <div class="card"><div class="tag" style="font-weight:600">Regálate tiempo.</div><div class="cap">600 (v1)</div></div>
  <div class="card"><div class="tag" style="font-weight:700">Regálate tiempo.</div><div class="cap">700</div></div>
  <div class="card lt"><div class="tag" style="font-weight:700;color:var(--ink)">Regálate tiempo.</div><div class="cap">700 on bone</div></div>
</div>
<script>
const dark=`<defs><filter id="b2" filterUnits="userSpaceOnUse" x="-14" y="-14" width="92" height="92"><feGaussianBlur stdDeviation="2"/></filter><filter id="b7" filterUnits="userSpaceOnUse" x="-14" y="-14" width="92" height="92"><feGaussianBlur stdDeviation="7"/></filter><filter id="b1" filterUnits="userSpaceOnUse" x="-14" y="-14" width="92" height="92"><feGaussianBlur stdDeviation=".8"/></filter><linearGradient id="rfg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#000"/></linearGradient><mask id="rf" maskUnits="userSpaceOnUse" x="0" y="42" width="64" height="22"><rect x="0" y="42" width="64" height="22" fill="url(#rfg)"/></mask></defs>`;
function mark(arch){return dark+`<circle cx="32" cy="26" r="21" fill="#F4B64C" opacity=".5" filter="url(#b7)"/><path d="M16 42V24a16 16 0 0 1 32 0v18" fill="none" stroke="${arch}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 42V26a8 8 0 0 1 16 0v16z" fill="#F4B64C" filter="url(#b2)"/><path d="M24 42V26a8 8 0 0 1 16 0v16z" fill="#F4B64C"/><path d="M10 42h44" fill="none" stroke="${arch}" stroke-width="1.4" stroke-linecap="round" opacity=".4"/><g mask="url(#rf)"><g transform="translate(0 84) scale(1 -1)" filter="url(#b1)"><path d="M16 42V24a16 16 0 0 1 32 0v18" fill="none" stroke="${arch}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 42V26a8 8 0 0 1 16 0v16z" fill="#F4B64C"/></g></g>`}
for(const [id,c] of [['s1','#F4EFF8'],['s2','#F4EFF8'],['s3','#1B102C']]){const s=document.getElementById(id);s.setAttribute('viewBox','0 0 64 58');s.innerHTML=mark(c).replace(/id="(b1|b2|b7|rfg|rf)"/g,`id="$1${id}"`).replace(/url\(#(b1|b2|b7|rfg|rf)\)/g,`url(#$1${id})`)}
</script>
</body></html>
